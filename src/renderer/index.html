<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNote</title>
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="components/titlebar/titlebar.css">
    <link rel="stylesheet" href="components/onboarding/onboarding.css">
    <link rel="stylesheet" href="components/rail/rail.css">
    <link rel="stylesheet" href="components/sidebar/sidebar.css">
    <link rel="stylesheet" href="components/toolbar/toolbar.css">
    <link rel="stylesheet" href="components/editor/editor.css">
    <link rel="stylesheet" href="components/home/home.css">
</head>
<body>
    <div id="app">
        <header id="titlebar"></header>
        <div id="titlebar-edge" aria-hidden="true"></div>
        <div id="onboarding"></div>
        <!-- class "workspace" kept so current app.js can show/hide the shell -->
        <div id="shell" class="shell workspace" hidden>
            <aside id="rail" class="rail" aria-label="App rail"></aside>
            <aside id="primary-sidebar" class="primary-sidebar">
                <header id="toolbar"></header>
                <div id="sidebar"></div>
                <div id="sidebar-empty" class="sidebar-empty" hidden>
                    <p class="sidebar-empty__copy">Nothing here yet</p>
                </div>
            </aside>
            <div id="main" class="main">
                <div id="home" class="home" hidden></div>
                <main id="content"></main>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
